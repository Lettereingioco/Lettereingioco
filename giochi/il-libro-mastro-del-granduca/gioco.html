<style>
/* Layout: un "banco del mercante" — barra di stato in alto, palcoscenico 16:9 al centro, riga dei verbi e pagine di libro mastro sotto. Tema unico: panno verde da banco, carta rigata, inchiostro rosso e blu. */
:root{
  --notte:#13201b;
  --laguna:#1d3029;
  --laguna-2:#284238;
  --pergamena:#f0e8d2;
  --pergamena-2:#dccfae;
  --inchiostro:#2b2018;
  --inchiostro-2:#5a4636;
  --oro:#c9a14a;
  --oro-scuro:#8a6c2a;
  --carminio:#b0322a;
  --verderame:#3f7a5a;
  --blu:#2c4a7a;
  --nebbia:#b4c2b4;
  --f-display:"IM Fell DW Pica SC", "Iowan Old Style", Georgia, serif;
  --f-testo:"Spectral", "Iowan Old Style", Georgia, serif;
  --f-etichetta:"Alegreya Sans SC", "Gill Sans", "Trebuchet MS", sans-serif;
  color-scheme:dark;
}
html,body{background:var(--notte);color:var(--pergamena)}
body{font-family:var(--f-testo);font-size:17px;line-height:1.5;
  background:radial-gradient(1200px 600px at 50% -10%, var(--laguna-2), var(--notte) 70%) fixed, var(--notte);}
#app{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 14px;border:1px solid var(--oro-scuro);background:linear-gradient(var(--laguna),var(--notte));border-radius:3px}
.hud .marchio{font-family:var(--f-display);font-size:22px;color:var(--oro);letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:10px}
.hud .voce{font-family:var(--f-etichetta);font-size:13px;letter-spacing:.08em;color:var(--nebbia);display:flex;align-items:center;gap:8px}
.hud .voce b{font-family:var(--f-testo);font-size:17px;letter-spacing:0;color:var(--pergamena);font-variant-numeric:tabular-nums}

  id:"madrid", anno:"1640", luogo:"Madrid", titolo:"L'oro che sparisce", lon:-3.7, lat:40.42,
  pagine:"pp. 110-111",
  intro:"Anno 1640. Dalle Americhe arrivano in Spagna oro e argento, eppure il Paese è sempre più povero. Il Granduca vuole sapere dove finisce tutta quella ricchezza. Sei in una piazza di Madrid.",
  hotspots:[
    {id:"hidalgo",nome:"Nobile spagnolo",tipo:"persona",
     testo:"«Lavorare con le mani? Sarebbe un disonore per un nobile di sangue come me. In Spagna non ci sono mercanti che investano l'oro delle Americhe: così arriva a noi nobili, e noi lo spendiamo. Carrozze, servitori, feste, e le stoffe più belle, comprate all'estero. Fabbriche e macchine agricole? Non sono cose da nobili.»",
     indizio:"Senza mercanti che investano, l'oro delle Americhe finisce ai nobili, che lo spendono in lusso e merci straniere invece di creare attività produttive."},
    {id:"picaro",nome:"Pícaro",tipo:"persona",
     testo:"«Io sono un pícaro: vivo di espedienti, per la strada. Siamo sempre di più. La maggior parte della gente era già povera, e ora il re, pieno di debiti, mette ogni anno nuove tasse.»",
     indizio:"Il re, pieno di debiti, aumenta le tasse: il popolo, già povero, diventa ancora più povero."},
    {id:"banchiere",nome:"Banchiere genovese",tipo:"persona",
     testo:"«Il re di Spagna mi deve una fortuna. L'oro delle Americhe arriva sempre meno: una parte la rubano i contrabbandieri, molte navi le assaltano i corsari francesi e inglesi. E quello che arriva viene speso subito, nel lusso e nelle guerre, senza produrre nuova ricchezza. Così l'oro finisce, e il re chiede prestiti a noi banchieri stranieri.»",
     indizio:"L'oro speso nel lusso e nelle guerre finisce, e ne arriva sempre meno (contrabbandieri e corsari): il re si indebita con banchieri stranieri."},
    {id:"prelato",nome:"Prelato",tipo:"persona",
     testo:"«La Chiesa possiede molte terre, e non paga tasse su di esse. Molti di noi prelati hanno anche importanti incarichi di governo.»",
     indizio:"Il clero possiede terre esenti da tasse e ha grande potere."},
    {id:"registro",nome:"Registro dei mercanti",tipo:"oggetto",
     testo:"Il registro elenca le botteghe e i banchi dei mercanti ebrei e dei moriscos, cacciati dalla Spagna. Erano gli unici capaci di far funzionare i commerci. Da allora nel Paese manca una borghesia di mercanti e imprenditori.",
     indizio:"Ebrei e moriscos, gli unici mercanti capaci, sono stati cacciati: in Spagna manca una borghesia che investa."}
  ],
  puzzle:{tipo:"ordine",consegna:"Ricostruisci la catena che porta la Spagna alla decadenza.",
    voci:["Ebrei e moriscos vengono cacciati: in Spagna manca una borghesia che investa.","L'oro delle Americhe finisce ai nobili, che lo spendono in lusso e merci straniere invece di creare attività produttive.","L'oro finisce e ne arriva sempre meno: il re si indebita con banchieri stranieri.","Il re aumenta le tasse e il popolo diventa ancora più povero."]},
  decisione:{domanda:"Il Granduca ti scrive: «La Spagna riceve tonnellate d'oro, eppure decade. Qual è il suo errore più grave?»",
    opzioni:[
      {t:"Possiede troppo poche miniere nelle colonie.",ok:false,sp:"Di oro ne arrivava moltissimo. Il problema era come veniva usato."},
      {t:"Ha troppi mercanti, che portano la ricchezza all'estero.",ok:false,sp:"È il contrario: i mercanti ebrei e moriscos erano stati cacciati, e in Spagna mancava proprio una borghesia."},
      {t:"Usa la ricchezza per il lusso e le guerre, invece di investirla in attività che producono nuova ricchezza.",ok:true,sp:"Esatto: senza una borghesia e senza investimenti produttivi, l'oro delle Americhe passava dalla Spagna senza fermarsi."}
    ],
    esito:"La Spagna scivola nei debiti e nella miseria. Il Granduca annota: «La ricchezza che non si investe se ne va». Ora devi vedere che cosa succede nei territori italiani governati dagli Spagnoli."}
},
{
  id:"napoli", anno:"1647", luogo:"Napoli", titolo:"Nove giorni di Masaniello", lon:14.25, lat:40.85,
  pagine:"pp. 112-113",
  intro:"Luglio 1647. A Napoli, capitale di un Regno governato da un viceré spagnolo, la piazza del Mercato è in rivolta. Il Granduca vuole sapere perché il popolo si ribella e come andrà a finire.",
  hotspots:[
    {id:"masaniello",nome:"Masaniello",tipo:"persona",
     testo:"«Mi chiamo Tommaso Aniello, ma tutti mi chiamano Masaniello: vendo pesce al mercato. Il viceré ha messo una tassa sulla frutta, dopo quella sul sale. La frutta è il cibo di noi poveri! Oggi il popolo di Napoli dice basta, e io lo guido.»",
     indizio:"Nel luglio 1647 il popolo di Napoli si ribella contro le tasse su sale e frutta: lo guida il pescivendolo Masaniello."},
    {id:"casotto",nome:"Casotto della gabella",tipo:"oggetto",
     testo:"Qui si pagava la gabella, la tassa sulla frutta. Ora il casotto brucia. La tassa l'ha decisa il viceré Ponce de León, che rappresenta il governo spagnolo: gli Spagnoli governano con durezza e tasse sempre più pesanti.",
     indizio:"Il viceré spagnolo aumenta le tasse su sale e frutta: il malgoverno spagnolo opprime il Sud."},
    {id:"contadina",nome:"Contadina",tipo:"persona",
     testo:"«Nelle campagne del Sud i signori sono tornati padroni come nel Medioevo: dobbiamo lavorare gratis le loro terre per molti giorni e non siamo liberi di andarcene. La chiamano rifeudalizzazione.»",
     indizio:"Al Sud si diffonde la rifeudalizzazione: i contadini tornano sotto i vincoli dei signori."},
    {id:"mercante",nome:"Mercante del porto",tipo:"persona",
     testo:"«Masaniello non è il cervello della rivolta, credetemi. Dietro di lui ci sono quelli che controllano il mercato e temono di guadagnare di meno con le nuove tasse.»",
     indizio:"Dietro Masaniello ci sono anche i commercianti, che temono per i loro guadagni."},
    {id:"avviso",nome:"Foglio di avvisi",tipo:"oggetto",
     testo:"Un foglio di notizie, scritto qualche giorno dopo: «Masaniello è diventato autoritario. Il 16 luglio i suoi stessi seguaci lo hanno ucciso: la sua avventura è durata nove giorni». Rivolte simili sono scoppiate a Milano nel 1628 e scoppieranno in Sicilia nel 1674: finiscono tutte con dure repressioni e con ancora più miseria.",
     indizio:"Masaniello, diventato autoritario, viene ucciso dopo nove giorni; le rivolte finiscono con repressioni e più miseria."}
  ],
  puzzle:{tipo:"ordine",consegna:"Metti in ordine gli eventi della rivolta di Napoli.",
    voci:["Il viceré spagnolo aumenta le tasse su sale e frutta.","Nel luglio 1647 il popolo di Napoli si ribella, guidato da Masaniello.","Masaniello diventa autoritario e viene ucciso dai suoi seguaci dopo nove giorni.","La rivolta viene repressa e la miseria del popolo aumenta."]},
  decisione:{domanda:"Il Granduca ti scrive: «Le rivolte del popolo riescono a migliorare la sua vita?»",
    opzioni:[
      {t:"Sì: dopo la rivolta il viceré abolisce per sempre le tasse.",ok:false,sp:"Nessuna rivolta ottenne l'abolizione delle tasse: le autorità risposero con la forza."},
      {t:"No: finiscono con repressioni e altra miseria, perché le cause, malgoverno e tasse, restano.",ok:true,sp:"Analisi corretta: le sommosse esplodevano per l'oppressione fiscale, ma venivano represse nel sangue e la miseria cresceva."},
      {t:"Sì: grazie a Masaniello il Regno di Napoli diventa indipendente.",ok:false,sp:"Napoli rimase sotto il dominio spagnolo; l'avventura di Masaniello durò nove giorni."}
    ],
    esito:"Il Granduca riflette: la Toscana è indipendente, ma deve evitare gli errori dei viceré. Ora ti manda a Venezia, per vedere come se la cavano gli Stati italiani che gli Spagnoli non governano."}
},
{
  id:"venezia", anno:"1648", luogo:"Venezia", titolo:"Gli Stati indipendenti", lon:12.33, lat:45.44,
  pagine:"pp. 114-115",
  intro:"Anno 1648, giorno dell'Ascensione. Il Doge esce in laguna sul Bucintoro per lo Sposalizio del mare: getterà in acqua un anello d'oro. Per la festa sono arrivati a Venezia diplomatici e mercanti da tutta Italia. Il Granduca vuole sapere come vanno gli Stati italiani che, come la Toscana, non sono governati dagli Spagnoli.",
  hotspots:[
    {id:"patrizio",nome:"Patrizio veneziano",tipo:"persona",
     testo:"«Qui non comandano viceré spagnoli. I grandi commerci ormai passano per l'Atlantico, eppure Venezia resta uno degli Stati più forti d'Italia. Il segreto? Nelle guerre che hanno sconvolto l'Europa siamo sempre rimasti neutrali. E la Repubblica è governata da noi patrizi con istituzioni solide: in tutta Europa ci considerano un esempio di stabilità.»",
     indizio:"Venezia non è governata dagli Spagnoli e resta forte: rimane neutrale nelle guerre ed è governata dal ceto patrizio con istituzioni stabili."},
    {id:"sabaudo",nome:"Ambasciatore dei Savoia",tipo:"persona",
     testo:"«Il Ducato di Savoia cresce ogni anno. Il duca Emanuele Filiberto ha spostato la capitale da Chambéry a Torino, ha creato una burocrazia efficiente e un esercito nazionale, ha aiutato l'agricoltura, i commerci e le manifatture. Con Oneglia abbiamo anche uno sbocco sul mare. Tra Spagna e Francia siamo un cuscinetto: tutti devono fare i conti con noi.»",
     indizio:"Il Ducato di Savoia è ben organizzato (capitale a Torino, burocrazia, esercito nazionale) e ha un ruolo internazionale come Stato cuscinetto tra Spagna e Francia."},
    {id:"genovese",nome:"Mercante genovese",tipo:"persona",
     testo:"«La mia Repubblica di Genova si chiama repubblica, ma la governano poche famiglie nobili, sempre in lite tra loro. Viviamo legati alla Spagna: il nostro porto è l'unico sbocco sul mare per il Ducato di Milano. E i Savoia vorrebbero prendersi la nostra costa.»",
     indizio:"Genova è governata da poche famiglie nobili in lite tra loro; il suo porto, sbocco sul mare per Milano, la lega alla Spagna; i Savoia premono sulla sua costa."},
    {id:"bolla",nome:"Copia dell'interdetto",tipo:"oggetto",
     testo:"Un vecchio documento conservato con cura. Anni fa Venezia arrestò due prelati colpevoli di reati comuni e li fece giudicare dai tribunali della Repubblica invece che da quelli religiosi. La Repubblica voleva limitare i privilegi del clero. Il papa rispose con la scomunica e l'interdetto: nessun sacramento, nessuna sepoltura religiosa, nessun rito in tutto il territorio veneziano. Le sanzioni furono tolte solo grazie alla mediazione del re di Francia.",
     indizio:"Per aver limitato i privilegi del clero, Venezia fu colpita dall'interdetto del papa, tolto grazie alla mediazione del re di Francia."},
    {id:"galea",nome:"Galea di guardia",tipo:"area",
     testo:"Questa galea pattuglia l'Adriatico contro gli Uscocchi, slavi fuggiti davanti ai Turchi e stabiliti nella penisola balcanica, che spesso si danno alla pirateria contro le navi veneziane.",
     indizio:"Venezia difende i suoi commerci dai pirati Uscocchi nell'Adriatico."},
    {id:"romana",nome:"Contadina dello Stato pontificio",tipo:"persona",
     testo:"«Vengo dalla campagna di Roma. Da quando tanti Paesi sono diventati protestanti, la Chiesa riceve meno decime e allora ha aumentato le tasse. Le terre sono di pochi grandi proprietari, i latifondisti, che le coltivano male. Molti, per la fame, si danno al brigantaggio.»",
     indizio:"Nello Stato pontificio crescono le tasse, le terre sono in mano a pochi latifondisti e nelle campagne si diffonde il brigantaggio."}
  ],
  puzzle:{tipo:"assegna",consegna:"Assegna ogni caratteristica allo Stato giusto.",
    gruppi:["Savoia","Genova","Venezia","Stato pontificio"],
    voci:[{t:"Capitale a Torino ed esercito nazionale",g:0},{t:"Stato cuscinetto tra Spagna e Francia",g:0},{t:"Porto legato alla Spagna, sbocco per Milano",g:1},{t:"Governo di poche famiglie nobili in lite tra loro",g:1},{t:"Neutrale nelle guerre, governata dal ceto patrizio",g:2},{t:"Colpita dall'interdetto del papa",g:2},{t:"Tasse aumentate e brigantaggio nelle campagne",g:3},{t:"Terre in mano a pochi latifondisti",g:3}]},
  decisione:{domanda:"Il Granduca ti scrive: «Gli Stati non governati dagli Spagnoli affrontano la crisi un po' meglio. Che cosa li aiuta di più?»",
    opzioni:[
      {t:"Possiedono grandi colonie in America da cui arrivano oro e argento.",ok:false,sp:"Nessuno di questi Stati aveva colonie in America: la loro forza veniva dall'organizzazione interna."},
      {t:"Non subiscono il malgoverno spagnolo, e i più forti, come Savoia e Venezia, sono organizzati in modo efficiente e stabile.",ok:true,sp:"Esatto: dove mancavano il dominio diretto spagnolo e le sue tasse, e lo Stato era ben organizzato, la crisi faceva meno danni."},
      {t:"Sono tutti alleati fedeli del papa, che li protegge.",ok:false,sp:"Venezia fu addirittura colpita dall'interdetto, e lo stesso Stato pontificio era in difficoltà."}
    ],
    esito:"Il Granduca annota che anche la Toscana deve puntare su un buon governo e su un'efficiente diplomazia: già oggi ha buoni rapporti con Spagna, Francia, Germania, Inghilterra e Olanda, e le flotte commerciali inglesi e olandesi fanno scalo nel porto toscano di Livorno. Ora ti manda a nord, dove la crisi sembra non arrivare: in Olanda."}
},
{
  id:"amsterdam", anno:"1650", luogo:"Amsterdam", titolo:"I carrettieri del mare", lon:4.9, lat:52.37,
  pagine:"pp. 116-119",
  intro:"Anno 1650. Amsterdam è diventata il porto più importante d'Europa. L'Olanda, liberata dal dominio spagnolo, è una repubblica governata da ricchi mercanti. Il Granduca vuole conoscere il segreto della sua ricchezza, e anche il suo prezzo.",
  hotspots:[
    {id:"azionista",nome:"Socia della Compagnia",tipo:"persona",
     testo:"«Nel 1602 tanti cittadini hanno messo il loro denaro nella Compagnia delle Indie Orientali. Anch'io ho comprato delle quote, che si chiamano azioni. Se la Compagnia guadagna, guadagno anch'io; se perde, perdo anch'io, sempre in proporzione alle azioni che possiedo. È una società per azioni.»",
     indizio:"La Compagnia delle Indie Orientali (1602) è una società per azioni: chi possiede azioni guadagna o perde in proporzione."},
    {id:"capitano",nome:"Capitano olandese",tipo:"persona",
     testo:"«Le nostre navi sono veloci, con grandi stive e poco equipaggio. Portiamo merci per tutti: cavalli e stoffe dalla Persia all'India e al Giappone, grano dalla Polonia, legname dalla Norvegia, sete italiane. Noleggiamo le navi a chi ne ha bisogno. Ci chiamano i carrettieri del mare.»",
     indizio:"Con una flotta di navi veloci e capienti, gli Olandesi trasportano merci di tutto il mondo: sono i carrettieri del mare."},
    {id:"borsa",nome:"La Borsa",tipo:"oggetto",
     testo:"Nella Borsa di Amsterdam mercanti, banchieri e agenti di cambio comprano e vendono ogni giorno merci e azioni. Accanto c'è la Banca dei cambi, fondata nel 1609, la prima banca pubblica d'Europa. I mercanti olandesi non sprecano i guadagni: li reinvestono in nuove attività, e così lo Stato diventa sempre più ricco.",
     indizio:"I mercanti olandesi reinvestono i guadagni in attività produttive; nascono la Banca dei cambi (1609) e la Borsa."},
    {id:"esule",nome:"Stampatore esule",tipo:"persona",
     testo:"«Sono un artigiano calvinista, fuggito dal mio Paese perché perseguitato. Qui nessuno mi chiede in che cosa credo: ebrei e calvinisti lavorano liberi. Ad Amsterdam ci sono quasi 300 librerie, e si stampano i primi fogli di notizie, gli antenati dei giornali.»",
     indizio:"La tolleranza religiosa attira artigiani abili perseguitati altrove; fioriscono libri, scienze e i primi giornali."},
    {id:"contratto",nome:"Contratto della Compagnia",tipo:"oggetto",
     testo:"Il contratto stabilisce le regole per le colonie: ogni territorio deve coltivare un solo prodotto e venderlo alla Compagnia a prezzi bassissimi; deve comprare i manufatti olandesi ai prezzi decisi dall'Olanda. Nelle colonie è vietato costruire manifatture. Chi non obbedisce viene costretto con la violenza.",
     indizio:"Le colonie devono coltivare un solo prodotto, pagato pochissimo, e non possono costruire manifatture: devono comprare quelle olandesi e restano dipendenti."}
  ],
  puzzle:{tipo:"assegna",consegna:"La ricchezza olandese ha due facce. Assegna ogni elemento al posto giusto.",
    gruppi:["Forza dell'Olanda","Prezzo per le colonie"],
    voci:[{t:"Società per azioni",g:0},{t:"Flotta di navi veloci e capienti",g:0},{t:"Guadagni reinvestiti in nuove attività",g:0},{t:"Tolleranza verso chi è perseguitato",g:0},{t:"Un solo prodotto imposto e pagato pochissimo",g:1},{t:"Divieto di costruire manifatture",g:1}]},
  decisione:{domanda:"Il Granduca ti scrive: «Che cosa può imparare la Toscana dall'Olanda?»",
    opzioni:[
      {t:"Vietare ai mercanti stranieri di lavorare in Toscana.",ok:false,sp:"L'Olanda faceva il contrario: accoglieva artigiani e mercanti da ogni Paese."},
      {t:"Investire i guadagni in commerci e attività produttive, accogliendo mercanti e artigiani di ogni fede.",ok:true,sp:"Esatto: reinvestimenti e tolleranza sono le chiavi della prosperità olandese."},
      {t:"Spendere i guadagni nel lusso della corte e dei nobili.",ok:false,sp:"È l'errore della Spagna: la ricchezza spesa nel lusso non produce nuova ricchezza né nuovo lavoro."}
    ],
    esito:"Il Granduca è colpito. Ma ti chiede di non dimenticare chi paga quella ricchezza nelle colonie. Prossima tappa: Londra, dove anche l'Inghilterra resiste alla crisi."}
},
{
  id:"londra", anno:"1655", luogo:"Londra", titolo:"Il fiume di ghiaccio", lon:-0.12, lat:51.5, dx:-6, dy:-20, lab:"sx",
  pagine:"p. 120",
  intro:"Inverno 1655. In questi anni il Tamigi gela più volte, e la gente si raduna sul ghiaccio tra bancarelle e falò. Anche l'Inghilterra, come l'Olanda, resiste alla crisi. Il Granduca vuole sapere come lavorano gli Inglesi.",
  hotspots:[
    {id:"imprenditore",nome:"Mercante-imprenditore",tipo:"persona",
     testo:"«Io compro lana e lino e affitto i telai ai contadini. D'inverno, quando i campi sono fermi, loro tessono a casa. Poi io ritiro le stoffe finite e le vendo. Paghiamo salari bassi, e così le nostre stoffe costano meno di quelle straniere: oggi l'Inghilterra è il primo produttore europeo di panni di lana e cotone. Qui, come in Olanda, è la borghesia a far crescere l'economia.»",
     indizio:"Il mercante-imprenditore compra lana e lino e affitta i telai ai contadini; poi ritira le stoffe finite e, grazie ai salari bassi, le vende a prezzi bassi: l'Inghilterra diventa il primo produttore europeo di panni."},
    {id:"tessitrice",nome:"Tessitrice",tipo:"persona",
     testo:"«D'inverno tesso a casa per il mercante. Il salario è misero, ma senza questo lavoro la mia famiglia non mangerebbe fino alla primavera.»",
     indizio:"D'inverno le famiglie contadine tessono a casa per un salario misero."},
    {id:"telaio",nome:"Telaio a mano",tipo:"oggetto",
     testo:"Il telaio è del mercante, non della famiglia che lo usa. Accanto, fasci di lino e canapa: nei campi inglesi si coltivano sempre più spesso canapa, lino e luppolo, le materie prime per le manifatture di stoffe e di birra.",
     indizio:"Si coltivano canapa, lino e luppolo, materie prime per stoffe e birra; i telai appartengono al mercante."},
    {id:"nave",nome:"Nave bloccata nel ghiaccio",tipo:"area",
     testo:"Una nave mercantile aspetta il disgelo. Già con la regina Elisabetta I l'Inghilterra ha potenziato la sua flotta mercantile e le sue manifatture. Qui, come in Olanda, sono i borghesi ricchi a investire in navi e botteghe.",
     indizio:"In Inghilterra, come in Olanda, una ricca borghesia investe nella flotta mercantile e nelle manifatture."},
    {id:"venditrice",nome:"Venditrice di castagne",tipo:"persona",
     testo:"«Castagne calde! Il Tamigi gela sempre più spesso: gli inverni sono freddissimi. Così montiamo le bancarelle direttamente sul fiume!»",
     indizio:"Gli inverni sono sempre più freddi (piccola glaciazione): il Tamigi gela e la gente monta le bancarelle sul ghiaccio."}
  ],
  puzzle:{tipo:"ordine",consegna:"Ricostruisci come funziona il lavoro del mercante-imprenditore.",
    voci:["Il mercante-imprenditore compra lana e lino e affitta i telai ai contadini.","D'inverno le famiglie contadine tessono a casa per un salario misero.","Il mercante ritira le stoffe finite.","Grazie ai salari bassi vende le stoffe a prezzi bassi: l'Inghilterra diventa il primo produttore europeo di panni."]},
  decisione:{domanda:"Il Granduca ti scrive: «Che cosa hanno in comune Olanda e Inghilterra, che resistono alla crisi?»",
    opzioni:[
      {t:"Una ricca borghesia che investe in commerci e manifatture.",ok:true,sp:"Esatto: in entrambi i Paesi una borghesia dinamica sosteneva l'economia e ne affrontava le difficoltà."},
      {t:"Una nobiltà numerosa che vive delle rendite delle sue terre.",ok:false,sp:"Questa è la situazione della Spagna e dell'Italia, che infatti non riuscivano a uscire dalla crisi."},
      {t:"Il dominio spagnolo, che garantisce ordine e sicurezza.",ok:false,sp:"L'Olanda si era liberata proprio dal dominio spagnolo, e l'Inghilterra ne era nemica."}
    ],
    esito:"Il Granduca annota: «Dove c'è una borghesia che lavora e investe, la crisi fa meno paura». Ma in Francia la soluzione è diversa: lì decide lo Stato."}
},
{
  id:"parigi", anno:"1667", luogo:"Parigi", titolo:"La manifattura del re", lon:2.35, lat:48.86,
  pagine:"p. 121",
  intro:"Anno 1667. In Francia è soprattutto lo Stato ad affrontare la crisi. Il ministro delle Finanze, Jean-Baptiste Colbert, ti riceve nella manifattura dei Gobelins, famosa per i suoi arazzi.",
  hotspots:[
    {id:"colbert",nome:"Jean-Baptiste Colbert",tipo:"persona",
     testo:"«La ricchezza di uno Stato si misura nella moneta che possiede. Per averne di più, la Francia deve vendere all'estero più di quanto compra. Per questo metto dazi, cioè tasse, sulle merci straniere che entrano nel regno.»",
     indizio:"Per Colbert la ricchezza dello Stato è la moneta posseduta: bisogna esportare più di quanto si importa, mettendo dazi sulle merci straniere."},
    {id:"arazziere",nome:"Maestro arazziere",tipo:"persona",
     testo:"«Il re aiuta le manifatture come la nostra, e come le armerie di Saint-Étienne. Le nostre botteghe sono giovani: senza l'aiuto dello Stato, la concorrenza straniera ci schiaccerebbe.»",
     indizio:"Lo Stato favorisce le manifatture francesi (arazzi dei Gobelins, armi di Saint-Étienne), ancora giovani e deboli davanti alla concorrenza."},

const W=1000,H=562;
function pavimento(y0,y1,vpx,vpy,c1,c2,tile,rows){
  const k=Math.pow((y1-vpy)/(y0-vpy),1/rows); const ys=[]; for(let r=0;r<=rows;r++) ys.push(vpy+(y0-vpy)*Math.pow(k,r));
  const X=(xb,y)=>vpx+(xb-vpx)*(y-vpy)/(y1-vpy);
  let s=""; const n=Math.ceil(1600/tile);
  for(let r=0;r<rows;r++) for(let i=-n;i<n;i++){ const xa=vpx+i*tile, xb=xa+tile, ya=ys[r], yb=ys[r+1];
    s+=`<path d="M${f1(X(xa,ya))} ${f1(ya)} L${f1(X(xb,ya))} ${f1(ya)} L${f1(X(xb,yb))} ${f1(yb)} L${f1(X(xa,yb))} ${f1(yb)}Z" fill="${Math.abs(r+i)%2?c1:c2}"/>`; }
  return s;
}

/* ========== SCENARI DEL SEICENTO ========== */
const casaFacciata=(x,y,w,h,col,fin,tetto)=>{
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}" ${ST}/>`;
  const cols=Math.max(2,Math.floor(w/40));
  for(let r=0;r<Math.floor((h-60)/56);r++) for(let i=0;i<cols;i++){ const fx=x+12+i*(w-24)/cols+((w-24)/cols-18)/2, fy=y+18+r*56; s+=`<rect x="${f1(fx)}" y="${fy}" width="18" height="28" fill="${fin}" ${ST}/><path d="M${f1(fx)} ${fy+14} h18 M${f1(fx+9)} ${fy} v28" stroke="${tono(fin,.3)}" stroke-width="1"/>`; }
  if(tetto) s+=`<path d="M${x-6} ${y} L${x+w+6} ${y} L${x+w-6} ${y-14} L${x+6} ${y-14}Z" fill="${tetto}" ${ST}/>`;
  return s;
};
function selciato(y0,col,col2){let s=`<rect y="${y0}" width="${W}" height="${H-y0}" fill="${col}"/>`;for(let y=y0+10;y<H;y+=15) for(let x=(y%30?0:16);x<W;x+=32) s+=`<path d="M${x} ${y} q16 -5 30 0" stroke="${col2}" stroke-width="2" fill="none" opacity=".7"/>`;return s;}

  const rotta=[[vx,vy]]; SCENE.forEach(sc=>{const [x,y]=pr(sc.lon,sc.lat); rotta.push([x+(sc.dx||0),y+(sc.dy||0)]);});
  const fatte=S.risultati.filter(Boolean).length;
  for(let i=0;i<rotta.length-1;i++){const a=rotta[i],b=rotta[i+1]; const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2-30;
    s+=`<path d="M${f1(a[0])} ${f1(a[1])} Q${f1(mx)} ${f1(my)} ${f1(b[0])} ${f1(b[1])}" fill="none" stroke="${i<fatte?"#a63a2f":INKM}" stroke-opacity="${i<=fatte?.85:.25}" stroke-width="${i<fatte?2.4:1.6}" stroke-dasharray="6 5"/>`;}
  SCENE.forEach((sc,i)=>{
    const [rx,ry]=pr(sc.lon,sc.lat); const x=rx+(sc.dx||0), y=ry+(sc.dy||0);
    const fatta=!!S.risultati[i], attuale=i===S.scena&&!fatta&&S.fase==="mappa", bloccata=!fatta&&!attuale;
    if(sc.dx) s+=`<line x1="${f1(rx)}" y1="${f1(ry)}" x2="${f1(x)}" y2="${f1(y)}" stroke="${INKM}" stroke-opacity=".6"/><circle cx="${f1(rx)}" cy="${f1(ry)}" r="3" fill="${INKM}"/>`;
    const sx=x>820||sc.lab==="sx"; const anchor=sx?"end":"start", lx=sx?x-22:x+22;
    s+=`<g class="mappa-citta" ${attuale?`tabindex="0" role="button" data-act="entra" data-i="${i}" aria-label="${esc(sc.luogo)}, ${sc.anno}, missione da svolgere"`:""} opacity="${bloccata?.5:1}">
      ${attuale?`<circle class="pulsa" cx="${f1(x)}" cy="${f1(y)}" r="15" fill="none" stroke="#a63a2f" stroke-width="2.5"/>`:""}
      ${fatta?`<path d="M${f1(x-15)} ${f1(y)} Q${f1(x-16)} ${f1(y-14)} ${f1(x)} ${f1(y-15)} Q${f1(x+15)} ${f1(y-15)} ${f1(x+15)} ${f1(y)} Q${f1(x+16)} ${f1(y+14)} ${f1(x)} ${f1(y+15)} Q${f1(x-14)} ${f1(y+16)} ${f1(x-15)} ${f1(y)}Z" fill="#a63a2f" stroke="#6e1f18" stroke-width="2"/><circle cx="${f1(x)}" cy="${f1(y)}" r="9.5" fill="none" stroke="#e6a59a" stroke-opacity=".6"/>`
        :`<circle class="anello" cx="${f1(x)}" cy="${f1(y)}" r="13" fill="${attuale?"#cfa64e":CARTA}" stroke="${INKM}" stroke-width="1.6"/>`}
      <text x="${f1(x)}" y="${f1(y+5)}" text-anchor="middle" font-family="IM Fell DW Pica SC,Georgia,serif" font-size="${ROMANI[i].length>3?11:14}" fill="${fatta?"#f2e8cc":INKM}">${ROMANI[i]}</text>
      <text x="${f1(lx)}" y="${f1(y+5)}" text-anchor="${anchor}" font-family="Alegreya Sans SC,Trebuchet MS,sans-serif" font-size="15" letter-spacing="1" fill="${attuale?"#a63a2f":INKM}" stroke="#f2e8cc" stroke-width="4" paint-order="stroke">${esc(sc.luogo)} · ${sc.anno}</text>
    </g>`;
  });
  return `<svg viewBox="0 0 1000 702" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Carta d'Europa con le missioni">${s}</svg>`;
}

function miniStemma(){return `<svg width="22" height="26" viewBox="-52 -62 104 134" aria-hidden="true">${stemmaMedici()}</svg>`;}

/* ========== RENDER ========== */
function annoCorrente(){return (S.fase==="consiglio"||S.fase==="finale")?"1669":SCENE[S.scena].anno;}
function hud(){
  const n=S.risultati.filter(Boolean).length;
  const tappa = (S.fase==="consiglio"||S.fase==="finale")?`<b>Consiglio</b>`:`<b>${Math.min(n+1,SCENE.length)}/${SCENE.length}</b>`;
  return `<div class="hud">
    <div class="marchio">${miniStemma()} Il Libro Mastro del Granduca</div>
    <div class="voce">Missione ${tappa}</div>
    <div class="voce">Anno <b>${annoCorrente()}</b></div>
    <div class="voce">Fiducia del Granduca <span class="barra" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${fiducia()}"><i style="width:${fiducia()}%"></i></span></div>
    <button class="btn-hud" data-act="taccuino">Libro mastro<span class="n">${totIndizi()}</span></button>
    <button class="btn-hud" data-act="chiedi-nuova">Nuova partita</button>
  </div>${S.confermaNuova?`<div class="conferma" role="alert"><span>Vuoi davvero ricominciare? Le missioni completate e il libro mastro verranno cancellati.</span><span class="azioni" style="margin:0"><button class="btn" data-act="nuova">Sì, ricomincia da capo</button><button class="btn sec" data-act="annulla-nuova">Annulla</button></span></div>`:""}`;
}

function render(){
  let h="";
  if(S.fase==="titolo") h=vistaTitolo();
  else if(S.fase==="mappa") h=hud()+vistaMappa();
  else if(S.fase==="scena") h=hud()+vistaScena();
  else if(S.fase==="consiglio") h=hud()+vistaConsiglio();
  else if(S.fase==="finale") h=hud()+vistaFinale();
  h+=`<p class="piede">Gioco didattico · Storia, scuola secondaria di primo grado · Il '600: nasce il sistema-mondo · Un gioco di Giorgio Guerra per Lettere in gioco</p>`;
  app.innerHTML=h;
  if(S.taccuino) app.insertAdjacentHTML("beforeend",vistaTaccuino());
}

function vistaTitolo(){
  const puoContinuare = salvato && ((salvato.risultati||[]).filter(Boolean).length>0 || Object.keys(salvato.esaminati||{}).length>0);
  return `<div class="frontespizio">
    <div style="display:flex;flex-direction:column;gap:14px;justify-content:center">
      <div class="sopra">Firenze · Palazzo Pitti · 1630</div>
      <h1>Il Libro Mastro del Granduca</h1>
      <p class="lead">Fame, peste e rivolte attraversano l'Europa, mentre alcuni Paesi diventano ricchissimi. Il Granduca di Toscana ti manda a scoprire perché. Raccogli indizi nel libro mastro, poi decidi il futuro economico della Toscana.</p>
      <div class="azioni">
        <button class="btn" data-act="nuova">${puoContinuare?"Nuova partita":"Inizia il viaggio"}</button>
        ${puoContinuare?`<button class="btn sec" data-act="continua">Continua il viaggio</button>`:""}
        <button class="btn sec" data-act="guida">${S.guida?"Chiudi la guida":"Guida per chi insegna"}</button>
      </div>
    </div>
    <div class="leone">${svgFrontespizio()}</div>
  </div>
  ${S.guida?vistaGuida():""}
  <div class="pergamena">
    <h3>Come si gioca</h3>
    <p>In ogni città tocca persone e oggetti: ogni informazione utile viene registrata nel <strong>libro mastro</strong>. Quando hai raccolto le informazioni importanti puoi scrivere la <strong>relazione al Granduca</strong>: prima ricostruisci cause ed effetti, poi rispondi alla sua domanda. Alla fine del viaggio, nel <strong>Consiglio di Palazzo Pitti</strong>, sceglierai tre politiche per la Toscana e vedrai i loro effetti su tesoro, lavoro, commercio e pace sociale.</p>
  </div>`;
}

function vistaGuida(){
  return `<div class="pergamena guida">
    <div class="meta">Per chi insegna</div>
    <h3>Il gioco in classe</h3>
    <ul>
      <li><strong>Contenuti:</strong> Unità 1, «Nasce il sistema-mondo» (pp. 106-126): economia-mondo e crisi del Seicento, peste, declino della Spagna, Italia spagnola e rivolte (Masaniello), Stati indipendenti (Savoia, Genova, Venezia, Stato pontificio), potenza commerciale olandese, mercante-imprenditore inglese, colbertismo, commercio triangolare, colonie del Nord America.</li>
      <li><strong>Struttura:</strong> otto missioni (esplorazione, catena causa-effetto o classificazione, domanda del Granduca) e un Consiglio finale in cui la classe applica ciò che ha imparato scegliendo tre politiche economiche.</li>
      <li><strong>Tempi:</strong> 50-60 minuti; si può dividere in due lezioni (missioni I-IV, poi V-VIII e Consiglio). Il gioco ricorda i progressi su questo dispositivo.</li>
      <li><strong>Organizzazione:</strong> a coppie o in piccoli gruppi, con un ruolo di «contabile» che legge e registra e uno di «agente» che decide dove cliccare. Nel Consiglio ogni gruppo deve motivare a voce le sue tre scelte.</li>
      <li><strong>La tratta degli schiavi</strong> è presentata come testimonianza: chi gioca non guadagna mai dal commercio di persone. Prima della missione VIII può essere utile introdurre il tema in classe.</li>
      <li><strong>Punteggio a base 50</strong> con tre livelli: sotto 30 livello non ancora raggiunto; da 30 livello base (voto 6); da 40 livello intermedio; 50 livello avanzato. Il giudizio finale indica le pagine da ripassare.</li>
      <li><strong>Dopo il gioco:</strong> chiedi una relazione di 8-10 righe al Granduca che confronti un Paese in crisi e uno prospero, con almeno tre indizi del libro mastro e due connettivi causali.</li>

  <h3>Crediti e licenza</h3><p>Gioco ideato da Giorgio Guerra e realizzato con l'aiuto di Claude (Anthropic). Licenza <a style="color:var(--carminio)" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.it" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>: si può usare e adattare citando l'autore, senza scopi commerciali, condividendo le modifiche con la stessa licenza. Altri giochi gratuiti su <a style="color:var(--carminio)" href="https://lettereingioco.it" target="_blank" rel="noopener">lettereingioco.it</a>.</p>

}

function vistaMappa(){
  const sc=SCENE[S.scena]; const fatte=S.risultati.filter(Boolean).length;
  return `<div class="stage carta">${svgMappa()}<div class="velatura"></div><div class="cartiglio"><small>Carta dei commerci</small>Scegli la prossima destinazione</div></div>
  <div class="riga"><span class="frase">Tocca la città segnata in oro: <b>${esc(sc.luogo)}, ${sc.anno}</b>${fatte?" · le città con il sigillo sono già visitate":""}</span>
  <button class="btn" data-act="entra" data-i="${S.scena}">Parti per ${esc(sc.luogo)}</button></div>
  <div class="pergamena"><div class="meta">Ordini del Granduca · Missione ${ROMANI[S.scena]}</div><h2>${esc(sc.luogo)}, ${sc.anno}: ${esc(sc.titolo)}</h2><p>${esc(sc.intro)}</p></div>`;
}

function vistaScena(){
  const sc=SCENE[S.scena];
  const inReport = S.sub!=="esplora";
  const lay=LAYOUT[sc.id]||{};
  const ordinati=sc.hotspots.slice().sort((a,b)=>((lay[b.id]||{}).area?1:0)-((lay[a.id]||{}).area?1:0));
  let hs = ordinati.map(h=>{
    const k=sc.id+":"+h.id, visto=!!S.esaminati[k];
    const verbo = h.tipo==="persona"?"Parla con":"Esamina";
    const L=lay[h.id]||{x:50,y:50};
    const tipo=L.area?"area":(h.tipo==="persona"?"persona":"oggetto");
    const stile=`left:${L.x}%;top:${L.y}%;--s:${L.s||1};`+(L.area?`width:${L.w}%;height:${L.h}%;`:"");
    const grafica = tipo==="persona"?figura(k):tipo==="oggetto"?oggetto2({k:L.k},k):"";
    return `<button class="hs ${tipo} ${visto?"":"nuovo"}" style="${stile}" data-act="hs" data-id="${h.id}" data-frase="${verbo} ${esc(h.nome)}" aria-label="${verbo} ${esc(h.nome)}${visto?" (già registrato)":""}" ${inReport?'tabindex="-1" disabled':""}>
      ${grafica}<span class="etichetta">${esc(h.nome)}</span>${visto?`<span class="sigillo" aria-hidden="true">✓</span>`:`<span class="segnale" aria-hidden="true"></span>`}</button>`;
  }).join("");
  const nInd = indiziScena(S.scena).length;
  const mancano = manca(S.scena);
  const pronto = nInd>=MIN_INDIZI && mancano===0;
  let riga = inReport ? `<span class="frase">Stai scrivendo la <b>relazione al Granduca</b></span><button class="btn sec" data-act="taccuino">Consulta il libro mastro</button>`
    : `<span class="frase" id="frase">Informazioni registrate qui: <b>${nInd}/${sc.hotspots.length}</b> · ${pronto?"puoi scrivere la relazione":nInd<MIN_INDIZI?"ne servono almeno "+MIN_INDIZI:"ti manca ancora qualche informazione importante: continua a esplorare"}</span>
       <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" data-act="mappa">Carta</button><button class="btn" data-act="report" ${pronto?"":"disabled"}>Scrivi la relazione</button></span>`;
  return `<div class="stage">${sfondo(sc)}<div class="velatura"></div>${hs}${inReport?'<div class="velo"></div>':""}<div class="cartiglio"><small>${sc.anno}</small>${esc(sc.luogo)}</div></div>
  <div class="riga">${riga}</div>
  ${inReport?vistaReport():vistaDialogo()}`;
}

function vistaDialogo(){
  const sc=SCENE[S.scena];
  if(!S.aperto){
    return `<div class="pergamena"><div class="meta">Missione ${ROMANI[S.scena]} · ${sc.anno}</div><h3>${esc(sc.titolo)}</h3><p>${esc(sc.intro)}</p><p><em>Tocca le persone e gli oggetti sulla scena.</em></p></div>`;
  }
  const h=sc.hotspots.find(x=>x.id===S.aperto);
  return `<div class="pergamena" aria-live="polite"><div class="meta">${h.tipo==="persona"?"Colloquio":"Osservazione"}</div><h3>${esc(h.nome)}</h3><p>${esc(h.testo)}</p><div class="indizio">${esc(h.indizio)}</div></div>`;
}

function vistaReport(){
  const sc=SCENE[S.scena]; const P=S.puzzle;
  if(S.sub==="puzzle"){
    let corpo="";
    if(sc.puzzle.tipo==="ordine"){
      const disp=P.mazzo.filter(v=>!P.scelte.includes(v));
      corpo=`<div class="etich-cat">CAUSA</div><div class="catena">`+
        sc.puzzle.voci.map((_,i)=>{const v=P.scelte[i]; return (i?`<div class="freccia">▼ quindi</div>`:"")+(v!==undefined?`<div class="slot"><span class="num">${i+1}</span><button data-act="togli" data-v="${esc(v)}" aria-label="Togli: ${esc(v)}">${esc(v)}</button></div>`:`<div class="slot vuoto"><span class="num">${i+1}</span>…</div>`);}).join("")+
        `</div><div class="etich-cat">EFFETTO</div>`+
        (disp.length?`<div class="carte">${disp.map(v=>`<button class="carta" data-act="scegli" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`:"");
      const completo=P.scelte.length===sc.puzzle.voci.length;
      corpo+=`<div class="azioni"><button class="btn" data-act="verifica" ${completo?"":"disabled"}>Verifica la catena</button>${P.scelte.length?`<button class="btn sec" data-act="azzera">Ricomincia</button>`:""}${P.msg?`<span class="avviso" role="status">${esc(P.msg)}</span>`:""}</div>`;
    } else {
      corpo=`<div class="assegna">`+P.mazzo.map((v,i)=>`<div class="riga-ass"><span>${esc(v.t)}</span><span class="scelta2" role="group" aria-label="${esc(v.t)}">${sc.puzzle.gruppi.map((g,gi)=>`<button data-act="assegna" data-i="${i}" data-g="${gi}" aria-pressed="${P.ass[i]===gi}">${esc(g)}</button>`).join("")}</span></div>`).join("")+`</div>`;
      const completo=P.ass.every(x=>x!==undefined&&x!==null);
      corpo+=`<div class="azioni"><button class="btn" data-act="verifica" ${completo?"":"disabled"}>Verifica</button>${P.msg?`<span class="avviso" role="status">${esc(P.msg)}</span>`:""}</div>`;
    }
    return `<div class="pergamena"><div class="meta">Relazione al Granduca · parte prima · tentativo ${P.tentativi+1}</div><h3>${sc.puzzle.tipo==="ordine"?"La catena di cause ed effetti":"Metti ordine nelle informazioni"}</h3><p>${esc(sc.puzzle.consegna)}</p>${corpo}</div>`;
  }
  if(S.sub==="decidi"||S.sub==="esito"){
    const d=sc.decisione; const sc_=S.scelta;
    const ops=d.opzioni.map((o,i)=>{
      let cls=""; if(sc_!==null){ if(o.ok) cls="giusta"; else if(i===sc_) cls="errata"; }
      return `<button class="opzione ${cls}" data-act="decidi" data-i="${i}" ${sc_!==null?"disabled":""}><span class="lett">${"ABC"[i]}</span>${esc(o.t)}</button>`;
    }).join("");
    let es="";
    if(sc_!==null){
      const o=d.opzioni[sc_], giusta=d.opzioni.find(x=>x.ok);
      const r=S.risultati[S.scena];
      es=`<div class="esito" aria-live="polite"><h3>${o.ok?"Il Granduca approva":"Il Granduca non è convinto"}</h3><p>${esc(o.sp)}</p>${o.ok?"":`<p><strong>La risposta della storia:</strong> ${esc(giusta.t)} ${esc(giusta.sp)}</p>`}
      <p><em>${esc(d.esito)}</em></p>
      <p class="punti">Punti della missione: catena ${r.puzzle}/3 · risposta ${r.dec}/3 · esplorazione ${r.esp}/1</p>
      <div class="azioni"><button class="btn" data-act="sigilla">${S.scena<SCENE.length-1?"Sigilla la relazione e torna alla carta":"Sigilla l'ultima relazione e torna a Firenze"}</button></div></div>`;
    }
    return `<div class="pergamena"><div class="meta">Relazione al Granduca · parte seconda</div><h3>La domanda del Granduca</h3><p>${esc(d.domanda)}</p><div class="opzioni">${ops}</div>${es}</div>`;
  }
  return "";
}

function vistaTaccuino(){
  let corpo="";
  SCENE.forEach((sc,i)=>{
    const ind=indiziScena(i);
    if(!ind.length && i>S.scena) return;
    corpo+=`<h3>${sc.anno} · ${esc(sc.luogo)}</h3>`+(ind.length?`<ul>${ind.map(h=>`<li>${esc(h.indizio)}</li>`).join("")}</ul>`:`<p class="vuota">Nessuna informazione ancora.</p>`);
  });
  return `<div class="cassetto" data-act="chiudi-t"><div class="foglio" role="dialog" aria-modal="true" aria-label="Libro mastro" data-stop="1">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Libro mastro</h2><button class="btn sec" style="color:var(--inchiostro)" data-act="chiudi-t">Chiudi</button></div>
    <p class="meta" style="font-family:var(--f-etichetta);letter-spacing:.1em;font-size:12px;color:var(--inchiostro-2)">Informazioni registrate: ${totIndizi()}</p>
    ${corpo||'<p class="vuota">Il libro mastro è vuoto: esplora la prima città.</p>'}
  </div></div>`;
}

/* ===== Consiglio di Palazzo Pitti ===== */
function indicatori(sel){
  const v=BASE_IND.slice();
  sel.forEach(id=>{const p=POLITICHE.find(x=>x.id===id); p.eff.forEach((e,i)=>v[i]+=e);});
  return v.map(x=>Math.max(0,Math.min(100,x)));
}
function vistaConsiglio(){
  const C=S.consiglio; const sel=C.scelte; const fatto=C.fatto;
  const vals=indicatori(fatto?sel:[]);
  const barre=NOMI_IND.map((n,i)=>{const d=vals[i]-BASE_IND[i];return `<div class="ind"><span class="ind-n">${n}</span><span class="ind-b"><i style="width:${vals[i]}%" class="${vals[i]<30?"basso":vals[i]>=60?"alto":""}"></i></span><span class="ind-v">${vals[i]}${fatto&&d?`<small class="${d>0?"su":"giu"}">${d>0?"+":""}${d}</small>`:""}</span></div>`;}).join("");
  const carte=POLITICHE.map(p=>{
    const on=sel.includes(p.id);
    let cls=on?"scelta":""; if(fatto&&on) cls+=p.ok?" giusta":" errata";
    return `<button class="politica ${cls}" data-act="politica" data-id="${p.id}" aria-pressed="${on}" ${fatto?"disabled":""}><span class="pol-t">${esc(p.t)}</span>${fatto&&on?`<span class="pol-sp">${esc(p.sp)}</span>`:""}</button>`;
  }).join("");
  const giuste=sel.filter(id=>POLITICHE.find(x=>x.id===id).ok).length;
  return `<div class="stage">${sfondo({id:"firenze"})}<div class="velatura"></div><div class="cartiglio"><small>1669 · Palazzo Pitti</small>Il Consiglio del Granduca</div>
    <div class="cruscotto" aria-live="polite">${barre}</div></div>
  <div class="riga"><span class="frase">${fatto?`Politiche efficaci scelte: <b>${giuste}/3</b>`:`Scegli <b>tre politiche</b> per la Toscana · selezionate: <b>${sel.length}/3</b>`}</span>
  ${fatto?`<button class="btn" data-act="finale">Leggi il giudizio del Granduca</button>`:`<button class="btn" data-act="proponi" ${sel.length===3?"":"disabled"}>Proponi al Consiglio</button>`}</div>
  <div class="pergamena">
    <div class="meta">Consiglio di Stato · Firenze</div>
    <h3>Quale politica economica per la Toscana?</h3>
    <p>La Toscana è indipendente, ma le sue manifatture di lana soffrono la concorrenza inglese e olandese. Usa ciò che hai visto nel viaggio: quali scelte fanno crescere uno Stato, quali lo portano alla crisi?</p>
    <div class="politiche">${carte}</div>
    ${fatto?`<p><em>${giuste===3?"Il Consiglio approva all'unanimità: la Toscana userà le lezioni dell'Olanda, dell'Inghilterra e della Francia, ed eviterà gli errori della Spagna e dei viceré.":giuste===2?"Il Consiglio approva con qualche dubbio: una delle tue proposte ripete un errore che hai visto durante il viaggio.":"Il Consiglio è preoccupato: le tue proposte ripetono gli errori che hai visto in Spagna e a Napoli."}</em></p>`:""}
  </div>`;
}

function vistaFinale(){
  const tot=puntiTotali(), max=SCENE.length*MAX_SCENA+MAX_CONSIGLIO;
  const voto=Math.round(tot/max*50);
  let liv,titolo,frase;
  if(voto>=50){liv="Livello avanzato";titolo="Consigliere del Granduca";frase="Le tue relazioni hanno spiegato con chiarezza cause ed effetti della crisi, e le tue proposte hanno messo la Toscana sulla strada giusta.";}
  else if(voto>=40){liv="Livello intermedio";titolo="Agente di commercio";frase="Hai capito gran parte dei meccanismi dell'economia del Seicento. Ripassa le missioni segnate per diventare consigliere.";}
  else if(voto>=30){liv="Livello base";titolo="Apprendista del banco";frase="Hai raggiunto il livello base: conosci i fatti principali dell'economia del Seicento. Ripassa le missioni segnate per rendere più precise le tue relazioni.";}
  else {liv="Livello non ancora raggiunto";titolo="Recluta del banco";frase="Hai completato il viaggio e raccolto molte informazioni. Riprendi le pagine indicate e rigioca: il Granduca ti darà un'altra occasione.";}
  const righe=SCENE.map((sc,i)=>{const r=S.risultati[i]||{puzzle:0,dec:0,esp:0}; const pt=r.puzzle+r.dec+r.esp; return `<tr><td>${ROMANI[i]}. ${esc(sc.luogo)}, ${sc.anno}</td><td class="n">${r.puzzle}/3</td><td class="n">${r.dec}/3</td><td class="n">${r.esp}/1</td><td>${pt>=6?"—":"Ripassa "+sc.pagine}</td></tr>`;}).join("");
  const pc=puntiConsiglio();
  return `<div class="stage carta">${svgMappa()}<div class="velatura"></div><div class="cartiglio"><small>1630 - 1669</small>Viaggio compiuto</div></div>
  <div class="pergamena">
    <div class="meta">Giudizio del Granduca</div>
    <h2>${titolo}</h2>
    <div class="voto"><span class="cifra">${voto}<span style="font-size:28px">/50</span></span><span class="liv">${liv}</span></div>
    <p style="margin-top:10px">${frase}</p>
    <div class="tabella"><table><thead><tr><th>Missione</th><th>Catena</th><th>Risposta</th><th>Esplorazione</th><th>Da ripassare</th></tr></thead><tbody>${righe}
    <tr><td>Consiglio di Palazzo Pitti</td><td class="n" colspan="3">${pc}/${MAX_CONSIGLIO}</td><td>${pc>=9?"—":"Ripassa pp. 110-121"}</td></tr></tbody></table></div>
    <p><strong>Per riflettere:</strong> l'Olanda e la Spagna ricevono entrambe grandi ricchezze dai commerci e dalle colonie. Perché una diventa più forte e l'altra decade? E chi, in entrambi i casi, paga il prezzo di quella ricchezza?</p>
    <p style="margin-top:14px">Sei un'insegnante o un insegnante? Altri giochi gratuiti e la guida didattica su <a style="color:var(--carminio)" href="https://lettereingioco.it" target="_blank" rel="noopener">lettereingioco.it</a>.</p>
    <div class="azioni"><button class="btn" data-act="nuova">Rigioca da capo</button><button class="btn sec" data-act="taccuino">Rileggi il libro mastro</button></div>
  </div>`;
}

/* ========== AZIONI ========== */
function avviaPuzzle(){
  const sc=SCENE[S.scena];
  if(sc.puzzle.tipo==="ordine") S.puzzle={mazzo:mescola(sc.puzzle.voci),scelte:[],tentativi:0,msg:""};
  else S.puzzle={mazzo:mescola(sc.puzzle.voci),ass:sc.puzzle.voci.map(()=>null),tentativi:0,msg:""};
}
function scrolla(sel){requestAnimationFrame(()=>{const el=app.querySelector(sel); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});});}

app.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  if(t.classList.contains("cassetto") && e.target.closest("[data-stop]")) return;
  agisci(t);
});
app.addEventListener("keydown",e=>{
  if(e.key==="Escape" && S.taccuino){S.taccuino=false;render();return;}
  const t=e.target.closest("g[data-act]"); if(t && (e.key==="Enter"||e.key===" ")){e.preventDefault();agisci(t);}
});
app.addEventListener("mouseover",e=>{
  const h=e.target.closest(".hs"); const f=document.getElementById("frase");
  if(h&&f&&!h.disabled){ if(!f.dataset.orig) f.dataset.orig=f.innerHTML; f.innerHTML=`<b>${esc(h.dataset.frase)}</b>`; }
});
app.addEventListener("mouseout",e=>{
  const h=e.target.closest(".hs"); const f=document.getElementById("frase");
  if(h&&f&&f.dataset.orig){ f.innerHTML=f.dataset.orig; delete f.dataset.orig; }
});

function agisci(t){
  const a=t.dataset.act; const sc=SCENE[S.scena];
  switch(a){
    case "nuova": cancella(); salvato=null; S=statoIniziale(); S.fase="mappa"; break;
    case "continua": {
      S=statoIniziale(); S.scena=salvato.scena||0; S.esaminati=salvato.esaminati||{}; S.risultati=salvato.risultati||[]; S.consiglio=salvato.consiglio||{scelte:[],fatto:false};
      const fatte=S.risultati.filter(Boolean).length;
      S.fase = fatte>=SCENE.length ? (S.consiglio.fatto?"finale":"consiglio") : "mappa"; break;
    }
    case "guida": S.guida=!S.guida; break;
    case "chiedi-nuova": S.confermaNuova=true; S.taccuino=false; window.scrollTo(0,0); break;
    case "annulla-nuova": S.confermaNuova=false; break;
    case "taccuino": S.taccuino=true; break;
    case "chiudi-t": S.taccuino=false; break;
    case "entra": { const i=+t.dataset.i; if(i!==S.scena) return; S.fase="scena"; S.sub="esplora"; S.aperto=null; window.scrollTo(0,0); break; }
    case "mappa": S.fase="mappa"; break;
    case "hs": { const id=t.dataset.id; S.aperto=id; S.esaminati[sc.id+":"+id]=1; salva(); render(); scrolla(".pergamena"); return; }
    case "report": S.sub="puzzle"; avviaPuzzle(); render(); scrolla(".pergamena"); return;
    case "scegli": S.puzzle.scelte.push(t.dataset.v); S.puzzle.msg=""; break;
    case "togli": S.puzzle.scelte=S.puzzle.scelte.filter(v=>v!==t.dataset.v); S.puzzle.msg=""; break;
    case "azzera": S.puzzle.scelte=[]; S.puzzle.msg=""; break;
    case "assegna": S.puzzle.ass[+t.dataset.i]=+t.dataset.g; S.puzzle.msg=""; break;
    case "verifica": {
      const P=S.puzzle; let giusti=0, tot;
      if(sc.puzzle.tipo==="ordine"){ tot=sc.puzzle.voci.length; P.scelte.forEach((v,i)=>{if(v===sc.puzzle.voci[i]) giusti++;}); }
      else { tot=P.mazzo.length; P.mazzo.forEach((v,i)=>{if(P.ass[i]===v.g) giusti++;}); }
      if(giusti===tot){
        const pts=Math.max(1,3-P.tentativi);
        const esp = indiziScena(S.scena).length===sc.hotspots.length ? 1 : 0;
        S.risultati[S.scena]={puzzle:pts,dec:0,esp:esp};
        S.sub="decidi"; S.scelta=null; render(); scrolla(".pergamena"); return;
      } else {
        P.tentativi++;
        P.msg=`${giusti} su ${tot} al posto giusto. Rileggi il libro mastro e riprova.`;
        if(sc.puzzle.tipo==="ordine"){ P.scelte=P.scelte.filter((v,i)=>v===sc.puzzle.voci[i] && P.scelte.slice(0,i).every((w,j)=>w===sc.puzzle.voci[j])); P.mazzo=mescola(P.mazzo); }
      }
      break;
    }
    case "decidi": {
      if(S.scelta!==null) return;
      const i=+t.dataset.i; S.scelta=i;
      S.risultati[S.scena].dec = sc.decisione.opzioni[i].ok?3:0;
      S.sub="esito"; salva(); break;
    }
    case "sigilla": {
      S.taccuino=false;
      if(S.scena<SCENE.length-1){ S.scena++; S.fase="mappa"; }
      else S.fase="consiglio";
      S.sub="esplora"; S.aperto=null; S.puzzle=null; S.scelta=null; salva(); window.scrollTo(0,0); break;
    }
    case "politica": {
      const C=S.consiglio; if(C.fatto) return; const id=t.dataset.id;
      if(C.scelte.includes(id)) C.scelte=C.scelte.filter(x=>x!==id); else if(C.scelte.length<3) C.scelte.push(id); else return;
      break;
    }
    case "proponi": { if(S.consiglio.scelte.length!==3) return; S.consiglio.fatto=true; salva(); window.scrollTo(0,0); break; }
    case "finale": S.fase="finale"; window.scrollTo(0,0); break;
  }
  render();
}

render();
})();
</script>
